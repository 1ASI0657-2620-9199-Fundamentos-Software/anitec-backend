# Local environment with horizontal scaling: one MySQL, two replicas of the API and an nginx load balancer.
#
#   cp .env.example .env     (then adjust the values)
#   docker compose up --build
#   curl -i http://localhost:8080/health     -> the X-Upstream header shows which replica answered
#
# The replicas are stateless (JWT, no session in memory) and share the folder of uploaded images through
# a volume. In the cloud that folder is replaced by object storage (finding R6 of section 5.1.4).
name: anitec

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set it}
      MYSQL_DATABASE: anitec-platform
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api1: &api
    build: .
    image: anitec-api:local
    environment: &api-environment
      # Development seeds the demo users (password anitec123); it is only meant for local use.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "server=db;port=3306;user=root;password=${MYSQL_ROOT_PASSWORD};database=anitec-platform;SslMode=Disabled;AllowPublicKeyRetrieval=True"
      TokenSettings__Secret: ${TOKEN_SECRET:?copy .env.example to .env and set it}
      Telemetry__MinIntervalSeconds: ${TELEMETRY_MIN_INTERVAL_SECONDS:-10}
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /dev/tcp is a bash feature, and the image has no curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api2:
    <<: *api
    environment:
      <<: *api-environment
    # The first replica applies the migrations; the second one starts when it is healthy.
    depends_on:
      db:
        condition: service_healthy
      api1:
        condition: service_healthy

  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  db-data:
  uploads:
