# Local environment: nginx -> two gateways (YARP) -> two replicas of the core API and the Subscriptions service.
#
#   cp .env.example .env     (then adjust the values)
#   docker compose up --build
#   curl -i http://localhost:8080/health                 -> answered by one of the gateways (X-Upstream header)
#   curl http://localhost:8080/gateway/status            -> health of every destination as the gateway sees it
#
#   browser/Postman -> lb (nginx, :8080) -> gateway1 / gateway2 (YARP)
#                                              |-- /api/v1/subscription-plans/**, /api/v1/subscriptions/** -> subscriptions
#                                              |-- everything else (/api/v1/**, /uploads/**)               -> api1 / api2
#
# The core replicas and the gateways are stateless (JWT, no session in memory). The replicas of the core share the
# folder of uploaded images through a volume; in the cloud it is replaced by object storage (finding R6 of 5.1.4).
# The Subscriptions service has its own database (anitec-subscriptions) and its own MySQL user, created by db-init.
name: anitec

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set it}
      MYSQL_DATABASE: anitec-platform
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the database and the user of the Subscriptions service. It is idempotent and runs on every start, so it
  # also works on a volume that already existed (the init scripts of the MySQL image only run on an empty volume).
  db-init:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set it}
      SUBSCRIPTIONS_DB_PASSWORD: ${SUBSCRIPTIONS_DB_PASSWORD:-change-me-local-only}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        mysql -h db -uroot -p"$$MYSQL_ROOT_PASSWORD" -e
        "CREATE DATABASE IF NOT EXISTS \`anitec-subscriptions\`;
        CREATE USER IF NOT EXISTS 'anitec_subscriptions'@'%' IDENTIFIED BY '$$SUBSCRIPTIONS_DB_PASSWORD';
        ALTER USER 'anitec_subscriptions'@'%' IDENTIFIED BY '$$SUBSCRIPTIONS_DB_PASSWORD';
        GRANT ALL PRIVILEGES ON \`anitec-subscriptions\`.* TO 'anitec_subscriptions'@'%';
        FLUSH PRIVILEGES;"

  api1: &api
    build: .
    image: anitec-api:local
    environment: &api-environment
      # Development seeds the demo users (password anitec123); it is only meant for local use.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "server=db;port=3306;user=root;password=${MYSQL_ROOT_PASSWORD};database=anitec-platform;SslMode=Disabled;AllowPublicKeyRetrieval=True"
      TokenSettings__Secret: ${TOKEN_SECRET:?copy .env.example to .env and set it}
      Telemetry__MinIntervalSeconds: ${TELEMETRY_MIN_INTERVAL_SECONDS:-10}
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /dev/tcp is a bash feature, and the image has no curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api2:
    <<: *api
    environment:
      <<: *api-environment
    # The first replica applies the migrations; the second one starts when it is healthy.
    depends_on:
      db:
        condition: service_healthy
      api1:
        condition: service_healthy

  subscriptions:
    build: ./Anitec.Subscriptions
    image: anitec-subscriptions:local
    environment:
      # Development keeps the helper endpoints of the service (mock checkout, plan management); never in production.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "server=db;port=3306;user=anitec_subscriptions;password=${SUBSCRIPTIONS_DB_PASSWORD:-change-me-local-only};database=anitec-subscriptions;SslMode=Disabled;AllowPublicKeyRetrieval=True"
      # The same secret as the core: both services validate the token that the core issues at login.
      TokenSettings__Secret: ${TOKEN_SECRET:?copy .env.example to .env and set it}
      # Stripe in test mode. Both values may stay empty: the service then answers that Stripe is not configured.
      StripeSettings__SecretKey: ${STRIPE_SECRET_KEY:-}
      StripeSettings__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      StripeSettings__SuccessUrl: ${FRONTEND_URL:-http://localhost:5173}/subscriptions/success?session_id={CHECKOUT_SESSION_ID}
      StripeSettings__CancelUrl: ${FRONTEND_URL:-http://localhost:5173}/subscriptions/cancel
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  gateway1: &gateway
    build: ./Anitec.Gateway
    image: anitec-gateway:local
    environment: &gateway-environment
      # Exposes /gateway/status (health of each destination). Off by default; it is for demos and verification.
      Gateway__ExposeStatus: "true"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      subscriptions:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  gateway2:
    <<: *gateway
    environment:
      <<: *gateway-environment

  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway1:
        condition: service_healthy
      gateway2:
        condition: service_healthy

volumes:
  db-data:
  uploads:
