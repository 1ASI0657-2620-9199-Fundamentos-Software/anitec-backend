events {}

http {
    # Round-robin load balancing between the two replicas of the gateway. The gateway is the only entry point to the
    # services: it routes by path to the core replicas or to the Subscriptions service.
    upstream anitec_gateway {
        server gateway1:8080;
        server gateway2:8080;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        location / {
            proxy_pass http://anitec_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If a gateway refuses the connection or does not answer, the request goes to the other one (nginx only
            # repeats idempotent methods). A short connect timeout makes the failover quick when a gateway disappears.
            #
            # Only "error" and "timeout" are failures of a gateway. A 502/503 is NOT in this list on purpose: the gateway
            # answers 502/503 when the SERVICE behind it is down (for example Subscriptions), and nginx would count each
            # of those answers as a failure of the gateway, take both gateways out of the rotation and make the whole
            # system answer 502 ("no live upstreams") even for the routes whose service is healthy (QAS-09).
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;

            # Evidence of the balancing: address of the gateway that answered.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
