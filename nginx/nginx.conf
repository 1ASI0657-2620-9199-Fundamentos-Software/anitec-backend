events {}

http {
    # Round-robin load balancing between the replicas of the API.
    upstream anitec_api {
        server api1:8080;
        server api2:8080;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        location / {
            proxy_pass http://anitec_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If a replica fails or does not answer, the request goes to the other one. A short connect timeout
            # makes the failover quick when a replica disappears from the network.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;

            # Evidence of the balancing: address of the replica that answered.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
